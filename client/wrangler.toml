# Cloudflare Pages project config - see README's "Deploying for free on
# Cloudflare" section for the full setup walkthrough.
#
# IMPORTANT: the dashboard's Git integration defaults "Deploy command" to
# `npx wrangler deploy`, which is for plain Workers and fails with "Missing
# entry-point to Worker script" here - override it to
# `npx wrangler pages deploy dist` (Wrangler's own error message says as
# much). pages_build_output_dir below matters for local tooling
# (`wrangler pages dev`) and as a hint for wrangler's Pages-vs-Worker
# detection, but doesn't make `wrangler deploy` itself work. Local
# `wrangler pages dev -- npm:dev` proxy mode can't be combined with this
# field (hence "pages:dev" in package.json builds first and runs
# `wrangler pages dev dist` instead - see the README's local-testing note).
name = "osrs-goal-planner"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-23"

[[d1_databases]]
binding = "DB"
database_name = "osrs-goal-planner-sync"
# Replace with the real ID printed by:
#   npx wrangler d1 create osrs-goal-planner-sync
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
