# Cloudflare Worker config - see README's "Deploying for free on Cloudflare"
# section for the full setup walkthrough.
#
# This is a Worker (not a "Pages project") deliberately: Cloudflare's
# dashboard Git integration auto-injects a CLOUDFLARE_API_TOKEN for the
# build/deploy commands that has Workers permissions but not Pages ones -
# `wrangler pages deploy` fails there with an opaque "Authentication error
# [code: 10000]" even for an account Super Admin, while plain `wrangler
# deploy` against a Worker (this file's `main` + `[assets]`) works with that
# same token. `worker/index.ts` serves the built SPA via the ASSETS binding
# and handles the API routes directly (ported from what used to be separate
# Pages Functions files).
name = "osrs-goal-planner"
main = "worker/index.ts"
compatibility_date = "2024-09-23"

[assets]
directory = "./dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "osrs-goal-planner-sync"
database_id = "21f80c92-8665-40c0-85c0-7eead4a76285"
