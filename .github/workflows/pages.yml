name: Build and deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci --workspaces

      - name: Build client (try normal build, fall back to artifact build)
        run: |
          set -e
          npm run build --workspace=client || npm run build:artifact --workspace=client

      - name: Prepare publish directory
        run: |
          if [ -d client/dist ]; then
            rm -rf publish || true
            mkdir -p publish
            cp -a client/dist/. publish/
          elif [ -d client/dist-artifact ]; then
            rm -rf publish || true
            mkdir -p publish
            cp -a client/dist-artifact/. publish/
          else
            echo "Build output not found (expected client/dist or client/dist-artifact)"
            ls -la client || true
            exit 1
          fi

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v1
        with:
          path: publish

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
